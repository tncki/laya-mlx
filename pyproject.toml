[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-mlx"
version = "0.4.0"
description = "Native MLX inference for Laya typed decision models on Apple silicon"
keywords = ["mlx", "laya", "typed-decisions", "decision-model", "local-ai", "apple-silicon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "mlx>=0.32.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=1.26",
  "huggingface-hub>=0.34,<2",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1"]
reference = ["torch>=2.14,<3", "transformers>=5.17,<6", "safetensors>=0.6"]
benchmark = ["matplotlib>=3.10", "pyarrow>=18"]
demo = ["rich>=15,<16", "Pillow>=12,<13"]

[project.scripts]
laya-mlx = "laya_mlx.cli:main"
laya-decide = "laya_mlx.cli:decide_main"
laya-snake = "laya_mlx.snake.cli:main"

[project.urls]
Repository = "https://github.com/mizorewww/laya-mlx"
Upstream = "https://github.com/NandhaKishorM/laya"
Documentation = "https://github.com/mizorewww/laya-mlx#readme"
Issues = "https://github.com/mizorewww/laya-mlx/issues"
Benchmarks = "https://github.com/mizorewww/laya-mlx/blob/main/BENCHMARKS.md"

# Upstream compatibility. `version` above is laya-mlx's own release line: this package is an
# independent port, not an official Convai Innovations release. These two fields record which
# upstream Laya release the port tracks, and tests/test_packaging.py fails if they drift from
# the commit pinned in .github/workflows/ci.yml or from README.md.
[tool.laya-mlx]
upstream-version = "0.3.20"
upstream-commit = "23a17522aa4942da6cce53a995a275760320b691"

[tool.hatch.build.targets.wheel]
packages = ["laya_mlx"]

[tool.hatch.build.targets.sdist]
include = ["/laya_mlx", "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded Laya checkpoints"]

[tool.ruff]
line-length = 100
extend-exclude = [".upstream"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
